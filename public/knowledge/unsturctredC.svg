<svg width="100%" height="600px" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" >
    <!-- Agent Boxes -->
    <rect x="150" y="350" width="150" height="150" fill="#4F2F2F" stroke="lightgray" stroke-width="2"/>
    <text x="225" y="425" fill="white" font-size="16" font-family="Arial" text-anchor="middle">Agent 1</text>
    
    <rect x="500" y="100" width="150" height="150" fill="#1E3A5F" stroke="lightgray" stroke-width="2"/>
    <text x="575" y="175" fill="white" font-size="16" font-family="Arial" text-anchor="middle">Agent 2</text>
    
    <rect x="900" y="350" width="150" height="150" fill="#3A2A0A" stroke="lightgray" stroke-width="2"/>
    <text x="975" y="425" fill="white" font-size="16" font-family="Arial" text-anchor="middle">Agent 3</text>
    
    <rect x="525" y="600" width="150" height="150" fill="#5A3F6B" stroke="lightgray" stroke-width="2"/>
    <text x="600" y="675" fill="white" font-size="16" font-family="Arial" text-anchor="middle">Agent 4</text>
    
    <!-- Arrows -->
    <line x1="300" y1="425" x2="500" y2="175" stroke="lightgray" stroke-width="3" marker-end="url(#arrowhead)"/>
    <line x1="300" y1="425" x2="900" y2="425" stroke="lightgray" stroke-width="3" marker-end="url(#arrowhead)"/>
    <line x1="575" y1="250" x2="575" y2="600" stroke="lightgray" stroke-width="3" marker-end="url(#arrowhead)"/>
    <line x1="575" y1="175" x2="900" y2="425" stroke="lightgray" stroke-width="3" marker-end="url(#arrowhead)"/>
    <line x1="575" y1="175" x2="575" y2="600" stroke="lightgray" stroke-width="3" marker-end="url(#arrowhead)"/>
    <line x1="600" y1="675" x2="900" y2="425" stroke="lightgray" stroke-width="3" marker-end="url(#arrowhead)"/>
    
    <!-- Arrowhead Definition -->
    <defs>
        <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="lightgray"/>
        </marker>
    </defs>
</svg>
